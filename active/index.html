<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Active — Gestão de Treinos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@300;400;500&display=swap"
          rel="stylesheet"/>

    <!--
    ═══════════════════════════════════════════════════════════════════════════════
    DECISÃO: CSS em <style> embutido.
    Tokens como CSS custom properties garantem consistência e facilitam temas.
    Estética industrial: fundo quase-preto, acento verde-lima, bordas finas,
    tipografia monospace para dados numéricos.
    ═══════════════════════════════════════════════════════════════════════════════
    -->
    <style>
        /* ── TOKENS ────────────────────────────────────────────────────────────── */
        :root {
          --bg:          #0C0D0B;
          --surface:     #141512;
          --surface2:    #1C1E1A;
          --surface3:    #232520;
          --border:      #2A2D26;
          --border2:     #363A2F;
          --accent:      #C5F135;
          --accent-dim:  #7B9720;
          --accent-glow: rgba(197,241,53,.08);
          --red:         #FF4545;
          --red-dim:     rgba(255,69,69,.12);
          --blue:        #4FA8FF;
          --blue-dim:    rgba(79,168,255,.12);
          --text:        #E6E8E0;
          --text2:       #9A9D93;
          --text3:       #5A5D54;
          --font-disp:   'Barlow Condensed', sans-serif;
          --font-body:   'Barlow', sans-serif;
          --font-mono:   'JetBrains Mono', monospace;
          --r:           4px;
          --r-lg:        8px;
        }

        /* ── RESET ─────────────────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
          background: var(--bg);
          color: var(--text);
          font-family: var(--font-body);
          font-size: 14px;
          line-height: 1.55;
          -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent); text-decoration: none; }
        button { cursor: pointer; font-family: inherit; }

        /* ── LAYOUT ─────────────────────────────────────────────────────────────── */
        #app { display: flex; min-height: 100vh; }

        /* Sidebar fixa — 220px. Sticky via position:sticky + height:100vh */
        .sidebar {
          width: 220px;
          flex-shrink: 0;
          background: var(--surface);
          border-right: 1px solid var(--border);
          display: flex;
          flex-direction: column;
          position: sticky;
          top: 0;
          height: 100vh;
          overflow-y: auto;
        }
        .sidebar-logo {
          padding: 22px 20px 18px;
          font-family: var(--font-disp);
          font-size: 26px;
          font-weight: 800;
          letter-spacing: .07em;
          text-transform: uppercase;
          border-bottom: 1px solid var(--border);
          line-height: 1;
        }
        .sidebar-logo span { color: var(--accent); }
        .sidebar-logo small {
          display: block;
          font-size: 10px;
          font-family: var(--font-mono);
          font-weight: 400;
          color: var(--text3);
          letter-spacing: .1em;
          margin-top: 2px;
        }

        /* Grupos de nav com rótulo de seção */
        .nav { padding: 10px 0; flex: 1; }
        .nav-section {
          font-family: var(--font-mono);
          font-size: 9px;
          font-weight: 700;
          letter-spacing: .16em;
          text-transform: uppercase;
          color: var(--text3);
          padding: 14px 18px 4px;
        }
        .nav-item {
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 8px 18px;
          font-family: var(--font-disp);
          font-size: 15px;
          font-weight: 500;
          letter-spacing: .03em;
          color: var(--text2);
          cursor: pointer;
          border-left: 2px solid transparent;
          transition: color .12s, background .12s, border-color .12s;
          user-select: none;
        }
        .nav-item:hover { color: var(--text); background: var(--surface2); }
        .nav-item.active {
          color: var(--accent);
          border-left-color: var(--accent);
          background: var(--accent-glow);
        }
        .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

        /* Footer da sidebar: perfil + logout */
        .sidebar-footer {
          padding: 14px 18px;
          border-top: 1px solid var(--border);
        }
        .user-chip {
          display: flex;
          align-items: center;
          gap: 9px;
          margin-bottom: 10px;
        }
        .user-avatar {
          width: 32px; height: 32px;
          border-radius: 50%;
          background: var(--accent);
          color: var(--bg);
          font-family: var(--font-disp);
          font-weight: 800;
          font-size: 14px;
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }
        .user-name { font-size: 13px; font-weight: 500; line-height: 1.2; }
        .user-role {
          font-family: var(--font-mono);
          font-size: 10px;
          color: var(--text3);
          text-transform: uppercase;
          letter-spacing: .08em;
        }

        /* ── MAIN AREA ──────────────────────────────────────────────────────────── */
        .main {
          flex: 1;
          padding: 36px 40px;
          max-width: 1080px;
          overflow-y: auto;
        }

        /* ── PAGE HEADER ────────────────────────────────────────────────────────── */
        .page-header { margin-bottom: 28px; }
        .page-title {
          font-family: var(--font-disp);
          font-size: 36px;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: .05em;
          line-height: 1;
        }
        .page-title em { color: var(--accent); font-style: normal; }
        .page-sub { color: var(--text2); font-size: 13px; margin-top: 5px; }

        /* ── CARDS ──────────────────────────────────────────────────────────────── */
        .card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--r-lg);
          padding: 20px 22px;
        }
        .card + .card, .card + .filter-bar { margin-top: 12px; }
        .card-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 16px;
        }
        .card-title {
          font-family: var(--font-disp);
          font-size: 16px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: .05em;
        }

        /* Stat cards — dashboard */
        .stats-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          margin-bottom: 24px;
        }
        .stat-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-top: 2px solid var(--accent);
          border-radius: var(--r-lg);
          padding: 18px 20px;
          cursor: pointer;
          transition: border-color .15s, background .15s;
        }
        .stat-card:hover { background: var(--surface2); border-color: var(--accent-dim); }
        .stat-val {
          font-family: var(--font-mono);
          font-size: 30px;
          font-weight: 700;
          color: var(--accent);
          line-height: 1;
        }
        .stat-lbl {
          font-family: var(--font-disp);
          font-size: 12px;
          font-weight: 600;
          letter-spacing: .08em;
          text-transform: uppercase;
          color: var(--text2);
          margin-top: 5px;
        }

        /* ── TABLE ──────────────────────────────────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; }
        th {
          font-family: var(--font-mono);
          font-size: 9px;
          font-weight: 700;
          letter-spacing: .14em;
          text-transform: uppercase;
          color: var(--text3);
          padding: 7px 12px;
          border-bottom: 1px solid var(--border);
          text-align: left;
        }
        td {
          padding: 10px 12px;
          border-bottom: 1px solid rgba(42,45,38,.6);
          font-size: 13px;
          vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background .1s; }
        tbody tr:hover td { background: rgba(255,255,255,.02); }

        /* ── BADGES ─────────────────────────────────────────────────────────────── */
        .badge {
          display: inline-block;
          padding: 2px 8px;
          border-radius: 2px;
          font-family: var(--font-mono);
          font-size: 9px;
          font-weight: 700;
          letter-spacing: .1em;
          text-transform: uppercase;
        }
        .bg  { background: var(--accent-glow);  color: var(--accent); }
        .bb  { background: var(--blue-dim);  color: var(--blue); }
        .br  { background: var(--red-dim);   color: var(--red); }
        .bk  { background: var(--surface3); color: var(--text2); }

        /* ── BUTTONS ────────────────────────────────────────────────────────────── */
        .btn {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 8px 16px;
          font-family: var(--font-disp);
          font-size: 14px;
          font-weight: 600;
          letter-spacing: .05em;
          text-transform: uppercase;
          border: none;
          border-radius: var(--r);
          transition: opacity .12s, transform .08s;
        }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .35; cursor: not-allowed; }
        .btn-acc { background: var(--accent); color: var(--bg); }
        .btn-acc:hover:not(:disabled) { opacity: .85; }
        .btn-ghost {
          background: transparent;
          color: var(--text2);
          border: 1px solid var(--border);
        }
        .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--border2); }
        .btn-danger {
          background: var(--red-dim);
          color: var(--red);
          border: 1px solid rgba(255,69,69,.2);
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255,69,69,.2); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-xs { padding: 3px 8px; font-size: 11px; }

        /* ── FORMS ──────────────────────────────────────────────────────────────── */
        .form-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
        .col-2  { grid-column: span 2; }
        .col-3  { grid-column: span 3; }
        .field  { display: flex; flex-direction: column; gap: 5px; }
        label {
          font-family: var(--font-mono);
          font-size: 9px;
          font-weight: 700;
          letter-spacing: .12em;
          text-transform: uppercase;
          color: var(--text3);
        }
        input, select, textarea {
          background: var(--surface2);
          border: 1px solid var(--border);
          border-radius: var(--r);
          color: var(--text);
          padding: 8px 10px;
          font-family: var(--font-body);
          font-size: 13px;
          outline: none;
          transition: border-color .12s;
          width: 100%;
        }
        input:focus, select:focus, textarea:focus {
          border-color: var(--accent);
        }
        select option { background: var(--surface2); }
        textarea { resize: vertical; min-height: 72px; }

        /* Checkbox-pills — seleção múltipla de músculos/equipamentos */
        .pill-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
        .pill {
          padding: 4px 10px;
          border-radius: var(--r);
          font-size: 12px;
          font-family: var(--font-body);
          border: 1px solid var(--border);
          background: var(--surface2);
          color: var(--text2);
          cursor: pointer;
          transition: all .12s;
          user-select: none;
        }
        .pill.on {
          border-color: var(--accent);
          background: var(--accent-glow);
          color: var(--accent);
        }

        /* ── ALERTS ─────────────────────────────────────────────────────────────── */
        .alert {
          padding: 10px 14px;
          border-radius: var(--r);
          font-size: 13px;
          margin-bottom: 14px;
        }
        .alert-err { background: var(--red-dim); border: 1px solid rgba(255,69,69,.3); color: var(--red); }
        .alert-ok  { background: var(--accent-glow); border: 1px solid rgba(197,241,53,.3); color: var(--accent); }

        /* ── MODAL ──────────────────────────────────────────────────────────────── */
        .overlay {
          position: fixed;
          inset: 0;
          z-index: 200;
          background: rgba(0,0,0,.72);
          backdrop-filter: blur(4px);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          animation: fadeIn .15s ease;
        }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        .modal {
          background: var(--surface);
          border: 1px solid var(--border2);
          border-radius: var(--r-lg);
          padding: 28px;
          width: 100%;
          max-width: 580px;
          max-height: 90vh;
          overflow-y: auto;
          animation: slideUp .18s ease;
        }
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }
        .modal-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 22px;
        }
        .modal-title {
          font-family: var(--font-disp);
          font-size: 22px;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: .05em;
        }
        .modal-foot {
          display: flex;
          gap: 10px;
          justify-content: flex-end;
          margin-top: 22px;
          padding-top: 18px;
          border-top: 1px solid var(--border);
        }

        /* ── FILTER BAR ─────────────────────────────────────────────────────────── */
        .filter-bar {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--r-lg);
          padding: 14px 18px;
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          align-items: flex-end;
          margin-bottom: 12px;
        }
        .filter-bar .field { min-width: 140px; }

        /* ── EMPTY / SPINNER ────────────────────────────────────────────────────── */
        .empty {
          text-align: center;
          padding: 48px 20px;
          color: var(--text2);
        }
        .empty-icon { font-size: 36px; margin-bottom: 8px; }
        .spinner {
          display: inline-block;
          width: 20px; height: 20px;
          border: 2px solid var(--border);
          border-top-color: var(--accent);
          border-radius: 50%;
          animation: spin .65s linear infinite;
          vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg) } }
        .loading-box { text-align: center; padding: 48px; }

        /* ── LOGIN ──────────────────────────────────────────────────────────────── */
        /*
        Decisão de design: grid de linhas finas no fundo simula papel milimetrado
        — reforça a estética de "ficha de treino" e diferencia do login genérico.
        */
        .login-page {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: var(--bg);
          background-image:
            repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
            repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px);
        }
        .login-box {
          background: var(--surface);
          border: 1px solid var(--border2);
          border-radius: var(--r-lg);
          padding: 40px;
          width: 100%;
          max-width: 400px;
          position: relative;
        }
        /* Barra verde no topo da caixa de login — assinatura visual */
        .login-box::before {
          content: '';
          position: absolute;
          top: -1px; left: 20px; right: 20px;
          height: 2px;
          background: var(--accent);
          border-radius: 0 0 2px 2px;
        }
        .login-logo {
          font-family: var(--font-disp);
          font-size: 40px;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: .08em;
          line-height: 1;
          margin-bottom: 4px;
        }
        .login-logo span { color: var(--accent); }
        .login-sub {
          color: var(--text2);
          font-size: 12px;
          margin-bottom: 28px;
          font-family: var(--font-mono);
          letter-spacing: .06em;
        }
        .login-form { display: flex; flex-direction: column; gap: 14px; }
        .login-switch {
          text-align: center;
          margin-top: 18px;
          font-size: 13px;
          color: var(--text2);
        }
        .link { color: var(--accent); cursor: pointer; }
        .link:hover { text-decoration: underline; }

        /* ── PR CARDS ───────────────────────────────────────────────────────────── */
        .pr-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
        .pr-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-top: 2px solid var(--accent);
          border-radius: var(--r-lg);
          padding: 18px 20px;
        }
        .pr-num {
          font-family: var(--font-mono);
          font-size: 32px;
          font-weight: 700;
          color: var(--accent);
          line-height: 1;
        }
        .pr-unit { font-size: 13px; color: var(--text2); margin-left: 3px; }
        .pr-lbl {
          font-family: var(--font-mono);
          font-size: 9px;
          letter-spacing: .12em;
          text-transform: uppercase;
          color: var(--text3);
          margin-bottom: 6px;
        }

        /* ── PLAN / SESSION BUILDER ─────────────────────────────────────────────── */
        .week-block {
          background: var(--surface2);
          border: 1px solid var(--border);
          border-radius: var(--r);
          padding: 14px 16px;
          margin-bottom: 10px;
        }
        .week-head {
          font-family: var(--font-disp);
          font-size: 13px;
          font-weight: 700;
          letter-spacing: .06em;
          text-transform: uppercase;
          color: var(--accent);
          margin-bottom: 10px;
        }
        .day-block {
          padding: 10px 0;
          border-top: 1px solid var(--border);
        }
        .day-head {
          font-family: var(--font-disp);
          font-size: 12px;
          font-weight: 600;
          color: var(--text2);
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .slot-row {
          display: grid;
          grid-template-columns: 2fr 60px 60px 70px 28px;
          gap: 6px;
          margin-bottom: 6px;
          align-items: end;
        }
        .set-row {
          display: grid;
          grid-template-columns: 1fr 1fr 28px;
          gap: 8px;
          margin-bottom: 6px;
          align-items: end;
        }
        .icon-btn {
          width: 28px; height: 28px;
          border-radius: var(--r);
          border: 1px solid var(--border);
          background: var(--surface3);
          color: var(--text2);
          font-size: 14px;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          transition: all .1s;
          align-self: flex-end;
        }
        .icon-btn:hover { border-color: var(--red); color: var(--red); }

        /* ── UTILITIES ──────────────────────────────────────────────────────────── */
        .mt-8  { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-12 { margin-bottom: 12px; }
        .mb-18 { margin-bottom: 18px; }
        .flex  { display: flex; }
        .items-center { align-items: center; }
        .gap-8  { gap: 8px; }
        .gap-12 { gap: 12px; }
        .muted  { color: var(--text2); }
        .mono   { font-family: var(--font-mono); }
        .acc    { color: var(--accent); }
        .fw5    { font-weight: 500; }
        .fs-12  { font-size: 12px; }
        .ml-a   { margin-left: auto; }
        .hidden { display: none !important; }

        /* ── SCROLLBAR ──────────────────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text3); }
    </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════════
  ESTRUTURA HTML
  #app é o ponto de montagem. A função render() injeta HTML via innerHTML.
  Modais são injetados em #modal-root, separado do fluxo principal.
═══════════════════════════════════════════════════════════════════════════ -->
<div id="app"></div>
<div id="modal-root"></div>

<script>
    /* ══════════════════════════════════════════════════════════════════════════════
       DECISÃO: JavaScript vanilla puro.
       Sem React, sem Vue, sem bundler. A app inteira funciona com um duplo-clique
       no arquivo. Estado global em `S`, re-render por `render()`.
       Cada página é uma função que retorna HTML string + registra handlers
       via event delegation no container.
    ══════════════════════════════════════════════════════════════════════════════ */

    // ── CONFIG ──────────────────────────────────────────────────────────────────
    const API = 'http://localhost:8080';

    // ── STATE ───────────────────────────────────────────────────────────────────
    /*
      S é o único objeto de estado global.
      Mutações via setState() garantem que o render seja sempre chamado depois.
      Dados de referência (muscles, equipments, exercises) são carregados uma vez
      no boot e mantidos aqui para evitar requisições repetidas.
    */
    const S = {
      page: 'login',       // página atual
      token: localStorage.getItem('active_token') || null,
      user: null,          // { name, email, role }

      // caches de referência
      muscles: [],
      equipments: [],
      exercises: [],

      // dados paginados por página
      users: [],
      plans: [],
      sessions: [],
      stats: { exercises: 0, plans: 0, sessions: 0, prs: 0 },

      // flags de loading
      loading: false,

      // formulários de login/register (persistem entre re-renders parciais)
      loginForm:    { email: '', password: '' },
      registerForm: { name:'', email:'', password:'', age:'', weight:'', height:'', trainingLevel:'BEGINNER' },
    };

    // ── ESTADO REATIVO MÍNIMO ───────────────────────────────────────────────────
    function setState(patch) {
      Object.assign(S, patch);
      render();
    }

    // ── JWT DECODE ──────────────────────────────────────────────────────────────
    /*
      Decodifica o payload do JWT no browser sem biblioteca.
      O backend assina com HMAC-SHA256 — a verificação é responsabilidade do server.
      Aqui só precisamos do sub/role/name para exibir na UI.
    */
    function decodeJwt(token) {
      try {
        const payload = token.split('.')[1];
        return JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
      } catch { return {}; }
    }

    function setToken(token) {
      localStorage.setItem('active_token', token);
      S.token = token;
      const p = decodeJwt(token);
      S.user = { email: p.sub, role: p.role || 'USER', name: p.name || p.sub };
    }

    function logout() {
      localStorage.removeItem('active_token');
      Object.assign(S, { token: null, user: null, page: 'login' });
      render();
    }

    // ── API LAYER ───────────────────────────────────────────────────────────────
    /*
      DECISÃO: request() centraliza headers e tratamento de erro.
      Todos os endpoints mapeiam 1:1 com o backend Spring Boot.
      Retorna null para respostas 204 No Content.
    */
    async function request(method, path, body, params) {
      let url = API + path;
      if (params) {
        const qs = new URLSearchParams(
          Object.fromEntries(Object.entries(params).filter(([,v]) => v != null && v !== ''))
        ).toString();
        if (qs) url += '?' + qs;
      }
      const opts = {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}),
        },
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      if (!res.ok) {
        const msg = await res.text().catch(() => res.statusText);
        throw new Error(msg || 'Erro ' + res.status);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    // Endpoints mapeados — nomes idênticos às rotas do backend
    const api = {
      login:              (d) => request('POST', '/auth/login', d),
      registerUser:       (d) => request('POST', '/users', d),
      listUsers:          (p) => request('GET',  '/users', null, p),
      deleteUser:         (id)=> request('DELETE',`/users/${id}`),
      listExercises:      (p) => request('GET',  '/exercises', null, p),
      getExercise:        (id)=> request('GET',  `/exercises/${id}`),
      createExercise:     (d) => request('POST', '/exercises', d),
      updateExercise:     (id,d)=>request('PUT', `/exercises/${id}`, d),
      deleteExercise:     (id)=> request('DELETE',`/exercises/${id}`),
      getPR:              (id)=> request('GET',  `/exercises/${id}/personal-record`),
      listMuscles:        (p) => request('GET',  '/muscles', null, p),
      createMuscle:       (d) => request('POST', '/muscles', d),
      listEquipments:     (p) => request('GET',  '/equipments', null, p),
      createEquipment:    (d) => request('POST', '/equipments', d),
      listPlans:          (p) => request('GET',  '/training-plans', null, p),
      getPlan:            (id)=> request('GET',  `/training-plans/${id}`),
      createPlan:         (d) => request('POST', '/training-plans', d),
      listSessions:       (p) => request('GET',  '/workout-sessions', null, p),
      getSession:         (id)=> request('GET',  `/workout-sessions/${id}`),
      createSession:      (d) => request('POST', '/workout-sessions', d),
    };

    // ── BOOT: carrega referências globais ───────────────────────────────────────
    /*
      Músculos, equipamentos e exercícios são carregados uma única vez no boot.
      São usados em vários formulários — ter em cache evita N requisições por modal.
    */
    async function boot() {
      if (!S.token) return;
      try {
        const [m, eq, ex, pl, ss] = await Promise.allSettled([
          api.listMuscles({ size: 200 }),
          api.listEquipments({ size: 200 }),
          api.listExercises({ size: 200 }),
          api.listPlans(),
          api.listSessions(),
        ]);
        S.muscles    = (m.value?.content  ?? m.value  ?? []);
        S.equipments = (eq.value?.content ?? eq.value ?? []);
        S.exercises  = (ex.value?.content ?? ex.value ?? []);
        const plans    = pl.value?.content ?? pl.value ?? [];
        const sessions = ss.value?.content ?? ss.value ?? [];
        S.stats = {
          exercises: S.exercises.length,
          plans: plans.length,
          sessions: sessions.length,
          prs: S.exercises.length,
        };
      } catch(e) { console.warn('boot error', e); }
    }

    // ── HELPERS DE TEMPLATE ─────────────────────────────────────────────────────
    const humanize = s => s
      ? s.replace(/_/g,' ').toLowerCase().replace(/^\w/, c => c.toUpperCase())
      : '—';

    const fmtDate  = s => s ? new Date(s).toLocaleDateString('pt-BR') : '—';
    const fmtDT    = s => s ? new Date(s).toLocaleString('pt-BR')  : '—';
    const esc      = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function alert$(id, msg, type='err') {
      const el = document.getElementById(id);
      if (el) {
        el.className = 'alert alert-' + type;
        el.textContent = msg;
        el.classList.remove('hidden');
      }
    }
    function clearAlert(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    }

    const spinner = () => `<span class="spinner"></span>`;

    function empty(icon, msg) {
      return `<div class="empty"><div class="empty-icon">${icon}</div><div>${msg}</div></div>`;
    }

    // ── RENDER PRINCIPAL ────────────────────────────────────────────────────────
    /*
      Ponto central de renderização.
      Se não autenticado → telas de login/registro.
      Se autenticado → shell com sidebar + página ativa.
    */
    function render() {
      const app = document.getElementById('app');
      if (!S.token) {
        app.innerHTML = S.page === 'register' ? pageRegister() : pageLogin();

    // ── SIDEBAR ─────────────────────────────────────────────────────────────────
    const NAV = [
      { id:'dashboard', label:'Dashboard',       icon:'⬡', section:null },
      { id:'sessions',  label:'Sessões',          icon:'🏋️', section:'Treino' },
      { id:'plans',     label:'Planos',           icon:'📋', section:'Treino' },
      { id:'records',   label:'Personal Records', icon:'🏆', section:'Treino' },
      { id:'exercises', label:'Exercícios',       icon:'💪', section:'Catálogo' },
      { id:'muscles',   label:'Músculos',         icon:'🦵', section:'Catálogo' },
      { id:'equipment', label:'Equipamentos',     icon:'🔩', section:'Catálogo' },
      { id:'users',     label:'Usuários',         icon:'👤', section:'Admin' },
    ];

    function renderSidebar() {
      const sections = [...new Set(NAV.map(n => n.section))];
      const items = sections.map(sec => `
        ${sec ? `<div class="nav-section">${sec}</div>` : ''}

      Em vez de addEventListener por elemento, usamos um listener no container pai.

    function bindLogin() {
      // login
      document.getElementById('go-register')?.addEventListener('click', () => {
        S.page = 'register'; render();
      });
      document.getElementById('form-login')?.addEventListener('submit', async e => {
        e.preventDefault();
        const email = document.getElementById('li-email').value.trim();
        const pass  = document.getElementById('li-pass').value;
        const btn   = document.getElementById('btn-li');
        btn.disabled = true; btn.innerHTML = spinner();
        clearAlert('login-alert');
        try {
          const res = await api.login({ email, password: pass });
          setToken(res.token); S.page = 'dashboard';
          await boot(); render();
        } catch { alert$('login-alert','Email ou senha inválidos.'); }
        finally  { btn.disabled = false; btn.textContent = 'Entrar'; }
      });

      // register
      document.getElementById('go-login')?.addEventListener('click', () => {
        S.page = 'login'; render();
      });
      document.getElementById('form-reg')?.addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('btn-rg');
        btn.disabled = true; btn.innerHTML = spinner();
        clearAlert('reg-alert');
        const data = {
          name:          document.getElementById('rg-name').value.trim(),
          email:         document.getElementById('rg-email').value.trim(),
          password:      document.getElementById('rg-pass').value,
          age:     +     document.getElementById('rg-age').value,
          weight:  +     document.getElementById('rg-weight').value,
          height:  +     document.getElementById('rg-height').value,
          trainingLevel: document.getElementById('rg-level').value,
          role:          document.getElementById('rg-role').value
        };
        try {
          await api.registerUser(data);
          const res = await api.login({ email: data.email, password: data.password });
          setToken(res.token); S.page = 'dashboard';
          await boot(); render();
        } catch(err) {
          alert$('reg-alert', err.message || 'Erro ao cadastrar.', 'err');
          btn.disabled = false; btn.textContent = 'Criar conta';
        }
      });
    }

        const res  = await api.listExercises(params);
        const data = res?.content ?? res ?? [];
        const isAdmin = S.user?.role === 'ADMIN';
        if (!data.length) { wrap.innerHTML = empty('💪','Nenhum exercício encontrado.'); return; }
        wrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Nome</th><th>Categoria</th>

                  </td>

        </div>

        <div class="field mb-12">
          <label>Músculos Primários</label>
          <div class="pill-group" id="ef-primary">
            ${S.muscles.map(m => {
              const on = ex?.primaryMuscles?.some(p=>p.id===m.id);
              return `<span class="pill ${on?'on':''}" data-pid="${m.id}">${esc(m.name)}</span>`;
            }).join('')}
          </div>
        </div>
        <div class="field mb-12">
          <label>Músculos Secundários</label>
          <div class="pill-group" id="ef-secondary">
            ${S.muscles.map(m => {
              const on = ex?.secondaryMuscles?.some(s=>s.id===m.id);
              return `<span class="pill ${on?'on':''}" data-sid="${m.id}">${esc(m.name)}</span>`;
            }).join('')}
          </div>
        </div>
        <div class="field mb-12">
          <label>Equipamentos</label>
          <div class="pill-group" id="ef-equip">

          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-acc" id="btn-ex-save">Salvar</button>
        </div>
      `);

      // pills toggle
      document.querySelectorAll('#ef-primary [data-pid]').forEach(p =>
        p.addEventListener('click', () => p.classList.toggle('on'))
      );
      document.querySelectorAll('#ef-secondary [data-sid]').forEach(p =>
        p.addEventListener('click', () => p.classList.toggle('on'))
      );
      document.querySelectorAll('#ef-equip [data-eqid]').forEach(p =>
        p.addEventListener('click', () => p.classList.toggle('on'))
      );

      document.getElementById('btn-ex-save').addEventListener('click', async () => {
        const btn = document.getElementById('btn-ex-save');
        btn.disabled = true; btn.innerHTML = spinner();
        const payload = {
          title:              document.getElementById('ef-title').value.trim(),
          category:           document.getElementById('ef-cat').value,
          videoUrl:           document.getElementById('ef-video').value.trim(),
          description:        document.getElementById('ef-desc').value.trim(),
          primaryMuscleIds:   [...document.querySelectorAll('#ef-primary .on')].map(e=>+e.dataset.pid),
          secondaryMuscleIds: [...document.querySelectorAll('#ef-secondary .on')].map(e=>+e.dataset.sid),
          equipmentIds:       [...document.querySelectorAll('#ef-equip .on')].map(e=>+e.dataset.eqid),
        };
        try {
          if (id) await api.updateExercise(id, payload);
          else    await api.createExercise(payload);
          // atualiza cache local
          const res = await api.listExercises({ size: 200 });
          S.exercises = res?.content ?? res ?? [];
          closeModal();
          loadExercises(currentExFilters());
        } catch(err) {
          alert$('ex-form-alert', err.message, 'err');
          btn.disabled = false; btn.textContent = 'Salvar';
        }
      });
    }

    // ── TRAINING PLANS ────────────────────────────────────────────────────────────
    /*
      DECISÃO: o formulário de criação usa um wizard em 2 etapas (info → semanas).
      Isso evita sobrecarregar o usuário com um formulário enorme de uma vez.
      A estrutura Plano > Semanas > Dias > Exercícios (slots) replica a hierarquia
      exata do banco de dados do backend.
    */
    function pagePlans() {
      return `
        <div class="page-header">
          <div class="page-title">PLANOS DE <em>TREINO</em></div>
          <div class="page-sub">Periodização semanal com dias e exercícios estruturados</div>
        </div>
        <div class="filter-bar">
          <div class="field" style="min-width:180px">
            <label>Nome do plano</label>
            <input id="flt-plan-name" placeholder="Buscar..." />
          </div>
          <div class="field" style="min-width:150px">
            <label>Objetivo</label>
            <select id="flt-plan-goal">
              <option value="">Todos</option>
              ${['WEIGHT_LOSS','MUSCLE_GAIN','CONDITIONING'].map(g=>
                `<option value="${g}">${humanize(g)}</option>`).join('')}
            </select>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-plan-clear">Limpar</button>
          <button class="btn btn-acc btn-sm ml-a" id="btn-plan-new">+ Novo Plano</button>
        </div>
        <div class="card" id="plans-table-wrap">
          <div class="loading-box">${spinner()}</div>
        </div>
      `;
    }

    async function loadPlans(params={}) {
      const wrap = document.getElementById('plans-table-wrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="loading-box">${spinner()}</div>`;
      try {
        const res  = await api.listPlans(params);
        const data = res?.content ?? res ?? [];
        if (!data.length) { wrap.innerHTML = empty('📋','Nenhum plano criado ainda.'); return; }
        const GOAL = {WEIGHT_LOSS:'br',MUSCLE_GAIN:'bb',CONDITIONING:'bg'};
        wrap.innerHTML = `
          <table>
            <thead><tr><th>Nome</th><th>Objetivo</th><th>Semanas</th><th>Criado em</th><th></th></tr></thead>
            <tbody>
              ${data.map(p=>`
                <tr>
                  <td class="fw5">${esc(p.name)}</td>
                  <td><span class="badge ${GOAL[p.goal]||'bk'}">${humanize(p.goal)}</span></td>
                  <td class="mono">${p.weekCount}</td>
                  <td class="muted fs-12">${fmtDate(p.createdAt)}</td>
                  <td>
                    <button class="btn btn-ghost btn-xs" data-plan-detail="${p.id}">Ver detalhes →</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        wrap.querySelectorAll('[data-plan-detail]').forEach(btn =>
          btn.addEventListener('click', () => openPlanDetail(+btn.dataset.planDetail))
        );
      } catch(e) { wrap.innerHTML = `<div class="alert alert-err">${esc(e.message)}</div>`; }
    }

    async function openPlanDetail(id) {
      showModal('Carregando plano...', `<div class="loading-box">${spinner()}</div>`);
      const plan = await api.getPlan(id).catch(() => null);
      if (!plan) { closeModal(); return; }
      const SPLIT = {UPPER_PUSH:'bb',UPPER_PULL:'bk',LOWER_PUSH:'br',LOWER_PULL:'bg',FULL_BODY:'bg'};
      const DAYS  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
      showModal(esc(plan.name), `
        <div class="flex gap-8 mb-12">
          <span class="badge bb">${humanize(plan.goal)}</span>
          <span class="badge bk">${plan.weekCount} semanas</span>
        </div>
        ${(plan.weeks||[]).map(w=>`
          <div class="week-block">
            <div class="week-head">SEMANA ${w.weekNumber}</div>
            ${(w.days||[]).map(d=>`
              <div class="day-block">
                <div class="day-head">
                  ${DAYS[(d.dayOfWeek||1)-1]||'Dia '+d.dayOfWeek}
                  ${d.splitFocus ? `<span class="badge ${SPLIT[d.splitFocus]||'bk'}">${humanize(d.splitFocus)}</span>` : ''}
                </div>
                ${(d.exercises||[]).map(s=>`
                  <div class="flex items-center" style="font-size:12px;padding:5px 0;border-top:1px solid var(--border);justify-content:space-between">
                    <span>${esc(s.exerciseTitle||s.exercise?.title||`#${s.exerciseId}`)}</span>
                    <span class="mono muted">${s.sets}×${s.reps} · ${s.restSeconds}s</span>
                  </div>
                `).join('')}
              </div>
            `).join('')}
          </div>
        `).join('')}
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
        </div>
      `);
    }

    // ── PLAN WIZARD ───────────────────────────────────────────────────────────────
    /*
      planDraft mantém o estado do wizard entre os dois passos.
      É mutado diretamente (não usa S) porque é local ao fluxo do modal.
    */
    let planDraft = null;

    function openPlanWizard() {
      planDraft = { name:'', goal:'MUSCLE_GAIN', weekCount: 4, weeks: [] };
      showModal('Novo Plano — Informações', planWizardStep1());
      document.getElementById('btn-pw-next').addEventListener('click', () => {
        planDraft.name      = document.getElementById('pw-name').value.trim();
        planDraft.goal      = document.getElementById('pw-goal').value;
        planDraft.weekCount = +document.getElementById('pw-weeks').value;
        if (!planDraft.name) { alert$('pw-alert','Nome obrigatório.'); return; }
        // Gera semanas/dias vazios
        planDraft.weeks = Array.from({length: planDraft.weekCount}, (_,wi) => ({
          weekNumber: wi+1,
          days: [{ dayOfWeek:1, splitFocus:'FULL_BODY', exercises:[] }],
        }));
        showModal('Novo Plano — Montar Semanas', planWizardStep2());
        bindPlanWizardStep2();
      });
    }

    function planWizardStep1() {
      const goals = ['WEIGHT_LOSS','MUSCLE_GAIN','CONDITIONING'];
      return `
        <div id="pw-alert" class="alert alert-err hidden"></div>
        <div class="form-grid mb-12">
          <div class="field col-2">
            <label>Nome do Plano</label>
            <input id="pw-name" value="${esc(planDraft.name)}" placeholder="ex: Hipertrofia 4x" required />
          </div>
          <div class="field">
            <label>Objetivo</label>
            <select id="pw-goal">
              ${goals.map(g=>`<option value="${g}" ${planDraft.goal===g?'selected':''}>${humanize(g)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Número de Semanas (1–52)</label>
            <input type="number" id="pw-weeks" value="${planDraft.weekCount}" min="1" max="52" />
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-acc" id="btn-pw-next">Montar semanas →</button>
        </div>
      `;
    }

    const SPLIT_OPTS = ['UPPER_PUSH','UPPER_PULL','LOWER_PUSH','LOWER_PULL','FULL_BODY'];
    const DAY_NAMES  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

    function renderSlots(wi, di) {
      return planDraft.weeks[wi].days[di].exercises.map((slot, ei) => `
        <div class="slot-row" id="slot-${wi}-${di}-${ei}">
          <div class="field">
            <select data-slot="${wi},${di},${ei},exerciseId">
              <option value="">— Exercício —</option>
              ${S.exercises.map(e=>
                `<option value="${e.id}" ${slot.exerciseId==e.id?'selected':''}>${esc(e.title)}</option>`
              ).join('')}
            </select>
          </div>
          <div class="field"><label>Séries</label>
            <input type="number" min="1" value="${slot.sets}" data-slot="${wi},${di},${ei},sets" /></div>
          <div class="field"><label>Reps</label>
            <input type="number" min="1" value="${slot.reps}" data-slot="${wi},${di},${ei},reps" /></div>
          <div class="field"><label>Descanso(s)</label>
            <input type="number" min="0" value="${slot.restSeconds}" data-slot="${wi},${di},${ei},restSeconds" /></div>
          <button class="icon-btn" data-rm-slot="${wi},${di},${ei}">✕</button>
        </div>
      `).join('');
    }

    function planWizardStep2() {
      return `
        <div id="pw2-alert" class="alert alert-err hidden"></div>
        <div id="pw2-weeks" style="max-height:440px;overflow-y:auto;padding-right:4px">
          ${planDraft.weeks.map((w,wi) => `
            <div class="week-block">
              <div class="week-head">SEMANA ${w.weekNumber}</div>
              ${w.days.map((d,di) => `
                <div class="day-block" id="day-${wi}-${di}">
                  <div class="day-head">
                    <select data-day="${wi},${di},dayOfWeek" style="width:120px">
                      ${DAY_NAMES.map((dn,idx)=>
                        `<option value="${idx+1}" ${d.dayOfWeek===idx+1?'selected':''}>${dn}</option>`
                      ).join('')}
                    </select>
                    <select data-day="${wi},${di},splitFocus" style="width:150px">
                      ${SPLIT_OPTS.map(s=>
                        `<option value="${s}" ${d.splitFocus===s?'selected':''}>${humanize(s)}</option>`
                      ).join('')}
                    </select>
                  </div>
                  <div id="slots-${wi}-${di}">${renderSlots(wi,di)}</div>
                  <button class="btn btn-ghost btn-xs mt-8" data-add-slot="${wi},${di}">+ Exercício</button>
                </div>
              `).join('')}
              <button class="btn btn-ghost btn-xs mt-8" data-add-day="${wi}">+ Dia</button>
            </div>
          `).join('')}
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="btn-pw-back">← Voltar</button>
          <button class="btn btn-acc" id="btn-pw-save">Salvar Plano</button>
        </div>
      `;
    }

    function bindPlanWizardStep2() {
      const modal = document.querySelector('.modal');

      modal.addEventListener('click', e => {
        const t = e.target;

        // adicionar exercício a um dia
        if (t.dataset.addSlot) {
          const [wi,di] = t.dataset.addSlot.split(',').map(Number);
          planDraft.weeks[wi].days[di].exercises.push({exerciseId:'',sets:3,reps:10,restSeconds:60});
          document.getElementById(`slots-${wi}-${di}`).innerHTML = renderSlots(wi,di);
          bindSlotInputs(modal);
        }
        // remover exercício
        if (t.dataset.rmSlot) {
          const [wi,di,ei] = t.dataset.rmSlot.split(',').map(Number);
          planDraft.weeks[wi].days[di].exercises.splice(ei,1);
          document.getElementById(`slots-${wi}-${di}`).innerHTML = renderSlots(wi,di);
          bindSlotInputs(modal);
        }
        // adicionar dia a uma semana
        if (t.dataset.addDay) {
          const wi = +t.dataset.addDay;
          const dayCount = planDraft.weeks[wi].days.length;
          planDraft.weeks[wi].days.push({dayOfWeek: Math.min(dayCount+1,7), splitFocus:'FULL_BODY', exercises:[]});
          reRenderWeeks();
        }

        if (t.id === 'btn-pw-back') {
          showModal('Novo Plano — Informações', planWizardStep1());
          document.getElementById('btn-pw-next').addEventListener('click', () => {
            planDraft.name      = document.getElementById('pw-name').value.trim();
            planDraft.goal      = document.getElementById('pw-goal').value;
            planDraft.weekCount = +document.getElementById('pw-weeks').value;
            if (!planDraft.name) { alert$('pw-alert','Nome obrigatório.'); return; }
            showModal('Novo Plano — Montar Semanas', planWizardStep2());
            bindPlanWizardStep2();
          });
        }
      });

      // salvar
      document.getElementById('btn-pw-save').addEventListener('click', async () => {
        const btn = document.getElementById('btn-pw-save');
        btn.disabled = true; btn.innerHTML = spinner();
        // captura valores dos inputs antes de salvar
        modal.querySelectorAll('[data-slot]').forEach(el => {
          const [wi,di,ei,key] = el.dataset.slot.split(',');
          planDraft.weeks[+wi].days[+di].exercises[+ei][key] = el.value;
        });
        modal.querySelectorAll('[data-day]').forEach(el => {
          const [wi,di,key] = el.dataset.day.split(',');
          planDraft.weeks[+wi].days[+di][key] = key === 'dayOfWeek' ? +el.value : el.value;
        });
        const payload = {
          name: planDraft.name, goal: planDraft.goal, weekCount: planDraft.weekCount,
          weeks: planDraft.weeks.map(w => ({
            weekNumber: w.weekNumber,
            days: w.days.map(d => ({
              dayOfWeek: +d.dayOfWeek, splitFocus: d.splitFocus,
              exercises: d.exercises.filter(s=>s.exerciseId).map(s=>({
                exerciseId:+s.exerciseId, sets:+s.sets, reps:+s.reps, restSeconds:+s.restSeconds,
              })),
            })),
          })),
        };
        try {
          await api.createPlan(payload);
          closeModal();
          loadPlans(currentPlanFilters());
          // atualiza stat
          const res = await api.listPlans(); S.stats.plans = (res?.content??res??[]).length;
        } catch(err) {
          alert$('pw2-alert', err.message, 'err');
          btn.disabled = false; btn.textContent = 'Salvar Plano';
        }
      });

      bindSlotInputs(modal);
      bindDaySelects(modal);
    }

    function bindSlotInputs(modal) {
      modal.querySelectorAll('[data-slot]').forEach(el => {
        el.addEventListener('change', () => {
          const [wi,di,ei,key] = el.dataset.slot.split(',');
          planDraft.weeks[+wi].days[+di].exercises[+ei][key] = el.value;
        });
      });
    }
    function bindDaySelects(modal) {
      modal.querySelectorAll('[data-day]').forEach(el => {
        el.addEventListener('change', () => {
          const [wi,di,key] = el.dataset.day.split(',');
          planDraft.weeks[+wi].days[+di][key] = key==='dayOfWeek' ? +el.value : el.value;
        });
      });
    }
    function reRenderWeeks() {
      const container = document.getElementById('pw2-weeks');
      if (!container) return;
      container.innerHTML = planWizardStep2().match(/<div id="pw2-weeks"[^>]*>([\s\S]*)<\/div>/)?.[1] || '';
      // mais simples: só re-renderiza o conteúdo de weeks
      const modal = document.querySelector('.modal');
      modal.innerHTML = planWizardStep2(); // full re-render
      document.getElementById('btn-pw-back').addEventListener('click', ()=>{});
      bindPlanWizardStep2();
    }

    function currentPlanFilters() {
      return {
        name: document.getElementById('flt-plan-name')?.value || undefined,
        goal: document.getElementById('flt-plan-goal')?.value || undefined,
      };
    }

    // ── WORKOUT SESSIONS ──────────────────────────────────────────────────────────
    /*
      DECISÃO: filtros fromDate/toDate/planName/exerciseId mapeiam exatamente
      os campos aceitos pelo WorkoutSessionController do backend.
    */
    function pageSessions() {
      return `
        <div class="page-header">
          <div class="page-title">SESSÕES DE <em>TREINO</em></div>
          <div class="page-sub">Histórico de treinos com filtros por data, plano e exercício</div>
        </div>
        <div class="filter-bar">
          <div class="field"><label>De</label>
            <input type="date" id="flt-ss-from" /></div>
          <div class="field"><label>Até</label>
            <input type="date" id="flt-ss-to" /></div>
          <div class="field" style="min-width:160px"><label>Nome do plano</label>
            <input id="flt-ss-plan" placeholder="Buscar plano..." /></div>
          <div class="field" style="min-width:150px"><label>Exercício</label>
            <select id="flt-ss-ex">
              <option value="">Todos</option>
              ${S.exercises.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')}
            </select>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-ss-clear">Limpar</button>
          <button class="btn btn-acc btn-sm ml-a" id="btn-ss-new">+ Registrar Treino</button>
        </div>
        <div class="card" id="ss-table-wrap">
          <div class="loading-box">${spinner()}</div>
        </div>
      `;
    }

    async function loadSessions(params={}) {
      const wrap = document.getElementById('ss-table-wrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="loading-box">${spinner()}</div>`;
      try {
        const res  = await api.listSessions(params);
        const data = res?.content ?? res ?? [];
        if (!data.length) { wrap.innerHTML = empty('🏋️','Nenhuma sessão registrada ainda.'); return; }
        wrap.innerHTML = `
          <table>
            <thead><tr><th>Data</th><th>Plano/Dia</th><th>Exercícios</th><th>Registrado em</th><th></th></tr></thead>
            <tbody>
              ${data.map(s=>`
                <tr>
                  <td class="mono">${fmtDate(s.date)}</td>
                  <td class="muted fs-12">${s.trainingPlanDayId ? 'Dia #'+s.trainingPlanDayId : 'Treino livre'}</td>
                  <td><span class="badge bg">${s.totalExercises} ex.</span></td>
                  <td class="muted fs-12">${fmtDT(s.createdAt)}</td>
                  <td><button class="btn btn-ghost btn-xs" data-ss-detail="${s.id}">Detalhes →</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        wrap.querySelectorAll('[data-ss-detail]').forEach(btn =>
          btn.addEventListener('click', () => openSessionDetail(+btn.dataset.ssDetail))
        );
      } catch(e) { wrap.innerHTML = `<div class="alert alert-err">${esc(e.message)}</div>`; }
    }

    async function openSessionDetail(id) {
      showModal('Detalhes da Sessão', `<div class="loading-box">${spinner()}</div>`);
      const s = await api.getSession(id).catch(()=>null);
      if (!s) { closeModal(); return; }
      showModal('Detalhes da Sessão', `
        <div class="flex gap-8 mb-12">
          <span class="badge bk">📅 ${fmtDate(s.date)}</span>
          <span class="badge bg">${s.totalExercises} exercícios</span>
        </div>
        ${(s.exercises||[]).map(ex=>`
          <div style="margin-bottom:16px">
            <div style="font-family:var(--font-disp);font-weight:700;font-size:15px;margin-bottom:8px">
              ${esc(ex.exerciseTitle)}
            </div>
            <table>
              <thead><tr><th>Série</th><th>Reps</th><th>Peso (kg)</th></tr></thead>
              <tbody>
                ${(ex.sets||[]).map((set,i)=>`
                  <tr>
                    <td class="mono muted">${i+1}</td>
                    <td class="mono">${set.reps}</td>
                    <td class="mono acc">${set.weightKg}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        `).join('')}
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
        </div>
      `);
    }

    // ── SESSION FORM ──────────────────────────────────────────────────────────────
    /*
      sessionDraft guarda o estado do formulário de registro de sessão.
      Estrutura: { date, trainingPlanDayId, exercises: [{ exerciseId, sets:[{reps,weightKg}] }] }
    */
    let sessionDraft = null;

    function openSessionForm() {
      const today = new Date().toISOString().split('T')[0];
      sessionDraft = {
        date: today,
        trainingPlanDayId: '',
        exercises: [{ exerciseId:'', sets:[{reps:10, weightKg:0}] }],
      };
      showModal('Registrar Treino', renderSessionForm());
      bindSessionForm();
    }

    function renderSessionForm() {
      return `
        <div id="ss-form-alert" class="alert alert-err hidden"></div>
        <div class="form-grid mb-12">
          <div class="field">
            <label>Data do Treino</label>
            <input type="date" id="sf-date" value="${sessionDraft.date}" />
          </div>
          <div class="field">
            <label>ID do Dia do Plano (opcional)</label>
            <input type="number" id="sf-dayid" value="${sessionDraft.trainingPlanDayId}"
              placeholder="Deixe vazio para treino livre" />
          </div>
        </div>
        <div id="sf-exercises" style="max-height:360px;overflow-y:auto;padding-right:4px">
          ${sessionDraft.exercises.map((ex,ei) => renderSessionExercise(ei)).join('')}
        </div>
        <button class="btn btn-ghost btn-sm mt-8" id="sf-add-ex">+ Exercício</button>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-acc" id="btn-ss-save">Salvar Sessão</button>
        </div>
      `;
    }

    function renderSessionExercise(ei) {
      const ex = sessionDraft.exercises[ei];
      return `
        <div class="week-block" id="sf-ex-${ei}">
          <div class="flex items-center gap-8 mb-12">
            <select style="flex:1" data-sf-exid="${ei}">
              <option value="">— Selecione exercício —</option>
              ${S.exercises.map(e=>
                `<option value="${e.id}" ${ex.exerciseId==e.id?'selected':''}>${esc(e.title)}</option>`
              ).join('')}
            </select>
            <button class="icon-btn" data-sf-rm-ex="${ei}">✕</button>
          </div>
          <div id="sf-sets-${ei}">
            ${ex.sets.map((s,si) => renderSessionSet(ei,si)).join('')}
          </div>
          <button class="btn btn-ghost btn-xs mt-8" data-sf-add-set="${ei}">+ Série</button>
        </div>
      `;
    }

    function renderSessionSet(ei, si) {
      const s = sessionDraft.exercises[ei].sets[si];
      return `
        <div class="set-row" id="sf-set-${ei}-${si}">
          <div class="field">
            <label>Reps</label>
            <input type="number" min="1" value="${s.reps}" data-sf-set="${ei},${si},reps" />
          </div>
          <div class="field">
            <label>Peso (kg)</label>
            <input type="number" step="0.5" min="0" value="${s.weightKg}" data-sf-set="${ei},${si},weightKg" />
          </div>
          <button class="icon-btn" data-sf-rm-set="${ei},${si}">−</button>
        </div>
      `;
    }

    function bindSessionForm() {
      const modal = document.querySelector('.modal');

      modal.addEventListener('click', e => {
        const t = e.target;

        if (t.dataset.sfAddSet !== undefined) {
          const ei = +t.dataset.sfAddSet;
          sessionDraft.exercises[ei].sets.push({reps:10,weightKg:0});
          document.getElementById(`sf-sets-${ei}`).innerHTML =
            sessionDraft.exercises[ei].sets.map((_,si)=>renderSessionSet(ei,si)).join('');
          rebindSessionInputs(modal);
        }

        if (t.dataset.sfRmSet !== undefined) {
          const [ei,si] = t.dataset.sfRmSet.split(',').map(Number);
          sessionDraft.exercises[ei].sets.splice(si,1);
          document.getElementById(`sf-sets-${ei}`).innerHTML =
            sessionDraft.exercises[ei].sets.map((_,si2)=>renderSessionSet(ei,si2)).join('');
          rebindSessionInputs(modal);
        }

        if (t.dataset.sfRmEx !== undefined) {
          const ei = +t.dataset.sfRmEx;
          sessionDraft.exercises.splice(ei,1);
          document.getElementById('sf-exercises').innerHTML =
            sessionDraft.exercises.map((_,i)=>renderSessionExercise(i)).join('');
          rebindSessionInputs(modal);
        }

        if (t.id === 'sf-add-ex') {
          sessionDraft.exercises.push({exerciseId:'', sets:[{reps:10,weightKg:0}]});
          document.getElementById('sf-exercises').innerHTML =
            sessionDraft.exercises.map((_,i)=>renderSessionExercise(i)).join('');
          rebindSessionInputs(modal);
        }
      });

      document.getElementById('btn-ss-save').addEventListener('click', async () => {
        const btn = document.getElementById('btn-ss-save');
        btn.disabled = true; btn.innerHTML = spinner();
        // captura valores atuais dos inputs
        modal.querySelectorAll('[data-sf-set]').forEach(el => {
          const [ei,si,key] = el.dataset.sfSet.split(',');
          sessionDraft.exercises[+ei].sets[+si][key] = +el.value;
        });
        modal.querySelectorAll('[data-sf-exid]').forEach(el => {
          sessionDraft.exercises[+el.dataset.sfExid].exerciseId = el.value;
        });
        sessionDraft.date            = document.getElementById('sf-date').value;
        sessionDraft.trainingPlanDayId = document.getElementById('sf-dayid').value;

        const payload = {
          date:              sessionDraft.date,
          trainingPlanDayId: sessionDraft.trainingPlanDayId ? +sessionDraft.trainingPlanDayId : null,
          exercises: sessionDraft.exercises.filter(ex=>ex.exerciseId).map(ex=>({
            exerciseId: +ex.exerciseId,
            sets: ex.sets.map(s=>({ reps:+s.reps, weightKg:+s.weightKg })),
          })),
        };
        try {
          await api.createSession(payload);
          closeModal();
          loadSessions();
          const res = await api.listSessions(); S.stats.sessions = (res?.content??res??[]).length;
        } catch(err) {
          alert$('ss-form-alert', err.message, 'err');
          btn.disabled = false; btn.textContent = 'Salvar Sessão';
        }
      });

      rebindSessionInputs(modal);
    }

    function rebindSessionInputs(modal) {
      modal.querySelectorAll('[data-sf-set]').forEach(el =>
        el.addEventListener('change', () => {
          const [ei,si,key] = el.dataset.sfSet.split(',');
          sessionDraft.exercises[+ei].sets[+si][key] = +el.value;
        })
      );
      modal.querySelectorAll('[data-sf-exid]').forEach(el =>
        el.addEventListener('change', () => {
          sessionDraft.exercises[+el.dataset.sfExid].exerciseId = el.value;
        })
      );
    }

    // ── PERSONAL RECORDS ──────────────────────────────────────────────────────────
    function pageRecords() {
      return `
        <div class="page-header">
          <div class="page-title">PERSONAL <em>RECORDS</em></div>
          <div class="page-sub">Maior peso, maior volume e data da conquista por exercício</div>
        </div>
        <div class="card mb-12">
          <div class="field" style="max-width:380px">
            <label>Selecione o exercício</label>
            <select id="pr-select">
              <option value="">— Escolha um exercício —</option>
              ${S.exercises.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div id="pr-result">${empty('🏆','Selecione um exercício para ver o PR.')}</div>
      `;
    }

    async function loadPR(exerciseId) {
      const box = document.getElementById('pr-result');
      if (!box) return;
      box.innerHTML = `<div class="loading-box">${spinner()}</div>`;
      try {
        const pr = await api.getPR(exerciseId);
        box.innerHTML = `
          <div class="pr-grid">
            <div class="pr-card">
              <div class="pr-lbl">Maior Peso</div>
              <div><span class="pr-num">${pr.maxWeightKg}</span><span class="pr-unit">kg</span></div>
            </div>
            <div class="pr-card">
              <div class="pr-lbl">Maior Volume</div>
              <div><span class="pr-num">${pr.maxReps}</span><span class="pr-unit">reps</span></div>
            </div>
            <div class="pr-card">
              <div class="pr-lbl">Data da Conquista</div>
              <div><span class="pr-num" style="font-size:22px">${fmtDate(pr.achievedAt)}</span></div>
            </div>
          </div>
          <div class="card">
            <div class="flex items-center gap-8">
              <span style="font-family:var(--font-disp);font-weight:700;font-size:18px">🏆 ${esc(pr.exerciseTitle)}</span>
              <span class="badge bk">ID #${pr.exerciseId}</span>
            </div>
          </div>
        `;
      } catch(e) {
        box.innerHTML = `<div class="alert alert-err">${esc(e.message)}</div>`;
      }
    }

    // ── USERS ─────────────────────────────────────────────────────────────────────
    function pageUsers() {
      return `
        <div class="page-header">
          <div class="page-title">USUÁ<em>RIOS</em></div>
          <div class="page-sub">Gestão de usuários cadastrados na plataforma</div>
        </div>
        <div class="filter-bar">
          <div class="field" style="flex:1"><label>Nome</label>
            <input id="flt-usr-name" placeholder="Buscar por nome..." /></div>
          <div class="field" style="flex:1"><label>Email</label>
            <input id="flt-usr-email" placeholder="Buscar por email..." /></div>
          <button class="btn btn-ghost btn-sm" id="btn-usr-clear">Limpar</button>
        </div>
        <div class="card" id="usr-table-wrap">
          <div class="loading-box">${spinner()}</div>
        </div>
      `;
    }

    async function loadUsers(params={}) {
      const wrap = document.getElementById('usr-table-wrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="loading-box">${spinner()}</div>`;
      try {
        const res  = await api.listUsers(params);
        const data = res?.content ?? res ?? [];
        if (!data.length) { wrap.innerHTML = empty('👤','Nenhum usuário encontrado.'); return; }
        const isAdmin = S.user?.role === 'ADMIN';
        const LVL = {BEGINNER:'bg', INTERMEDIATE:'bb', ADVANCED:'br'};
        wrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Nome</th><th>Email</th><th>Nível</th>
                <th>Peso</th><th>Altura</th><th>Idade</th>
                ${isAdmin ? '<th>Ações</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${data.map(u=>`
                <tr>
                  <td class="fw5">${esc(u.name)}</td>
                  <td class="muted fs-12">${esc(u.email)}</td>
                  <td><span class="badge ${LVL[u.trainingLevel]||'bk'}">${humanize(u.trainingLevel)}</span></td>
                  <td class="mono">${u.weight ? u.weight+'kg' : '—'}</td>
                  <td class="mono">${u.height ? u.height+'m' : '—'}</td>
                  <td class="mono">${u.age||'—'}</td>
                  ${isAdmin ? `<td>
                    <button class="btn btn-danger btn-xs" data-del-user="${u.id}">Excluir</button>
                  </td>` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        if (isAdmin) {
          wrap.querySelectorAll('[data-del-user]').forEach(btn =>
            btn.addEventListener('click', async () => {
              if (!confirm('Excluir usuário?')) return;
              await api.deleteUser(+btn.dataset.delUser);
              loadUsers(currentUserFilters());
            })
          );
        }
      } catch(e) { wrap.innerHTML = `<div class="alert alert-err">${esc(e.message)}</div>`; }
    }

    function currentUserFilters() {
      return {
        name:  document.getElementById('flt-usr-name')?.value  || undefined,
        email: document.getElementById('flt-usr-email')?.value || undefined,
      };
    }

    // ════════════════════════════════════════════════════════════════════════════
    //  MODAL SYSTEM
    //  showModal/closeModal operam no #modal-root, separado do #app.
    //  Isso evita que o re-render do app destrua modais abertos.
    // ════════════════════════════════════════════════════════════════════════════
    function showModal(title, body) {
      document.getElementById('modal-root').innerHTML = `
        <div class="overlay" id="modal-overlay">
          <div class="modal">
            <div class="modal-head">
              <div class="modal-title">${title}</div>
              <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
            </div>
            ${body}
          </div>
        </div>
      `;
      // fechar ao clicar no overlay
      document.getElementById('modal-overlay').addEventListener('click', e => {
        if (e.target.id === 'modal-overlay') closeModal();
      });
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    // ════════════════════════════════════════════════════════════════════════════
    //  BINDING POR PÁGINA — chamado após render()
    //  Cada página registra seus próprios event listeners depois de ser injetada.
    // ════════════════════════════════════════════════════════════════════════════
    function bindPage() {
      // Sidebar navigation
      document.querySelectorAll('[data-nav]').forEach(el =>
        el.addEventListener('click', () => { S.page = el.dataset.nav; render(); })
      );
      document.getElementById('btn-logout')?.addEventListener('click', logout);

      // Dashboard: stat cards também têm data-nav
      // (já capturado acima pelo querySelectorAll('[data-nav]'))

      // Exercises
      if (S.page === 'exercises') {
        loadExercises();
        document.getElementById('flt-cat')?.addEventListener('change',
          () => loadExercises(currentExFilters()));
        document.getElementById('flt-muscle')?.addEventListener('change',
          () => loadExercises(currentExFilters()));
        document.getElementById('flt-eq')?.addEventListener('change',
          () => loadExercises(currentExFilters()));
        document.getElementById('btn-ex-clear')?.addEventListener('click', () => {
          document.getElementById('flt-cat').value = '';
          document.getElementById('flt-muscle').value = '';
          document.getElementById('flt-eq').value = '';
          loadExercises();
        });
        document.getElementById('btn-ex-new')?.addEventListener('click',
          () => openExerciseForm());
      }

      // Muscles
      if (S.page === 'muscles') {
        document.getElementById('btn-mu-save')?.addEventListener('click', async () => {
          const btn = document.getElementById('btn-mu-save');
          btn.disabled = true; btn.innerHTML = spinner();
          clearAlert('mu-alert');
          try {
            await api.createMuscle({
              name:   document.getElementById('mu-name').value.trim(),
              nameEn: document.getElementById('mu-en').value.trim(),
            });
            const res = await api.listMuscles({ size:200 });
            S.muscles = res?.content ?? res ?? [];
            render();
          } catch(e) {
            alert$('mu-alert', e.message, 'err');
            btn.disabled = false; btn.textContent = '+ Adicionar';
          }
        });
      }

      // Equipment
      if (S.page === 'equipment') {
        document.getElementById('btn-eq-save')?.addEventListener('click', async () => {
          const btn = document.getElementById('btn-eq-save');
          btn.disabled = true; btn.innerHTML = spinner();
          clearAlert('eq-alert');
          try {
            await api.createEquipment({ name: document.getElementById('eq-name').value.trim() });
            const res = await api.listEquipments({ size:200 });
            S.equipments = res?.content ?? res ?? [];
            render();
          } catch(e) {
            alert$('eq-alert', e.message, 'err');
            btn.disabled = false; btn.textContent = '+ Adicionar';
          }
        });
      }

      // Plans
      if (S.page === 'plans') {
        loadPlans();
        document.getElementById('flt-plan-name')?.addEventListener('input',
          () => loadPlans(currentPlanFilters()));
        document.getElementById('flt-plan-goal')?.addEventListener('change',
          () => loadPlans(currentPlanFilters()));
        document.getElementById('btn-plan-clear')?.addEventListener('click', () => {
          document.getElementById('flt-plan-name').value = '';
          document.getElementById('flt-plan-goal').value = '';
          loadPlans();
        });
        document.getElementById('btn-plan-new')?.addEventListener('click', openPlanWizard);
      }

      // Sessions
      if (S.page === 'sessions') {
        loadSessions();
        const rebind = () => loadSessions({
          fromDate:   document.getElementById('flt-ss-from')?.value  || undefined,
          toDate:     document.getElementById('flt-ss-to')?.value    || undefined,
          planName:   document.getElementById('flt-ss-plan')?.value  || undefined,
          exerciseId: document.getElementById('flt-ss-ex')?.value    || undefined,
        });
        document.getElementById('flt-ss-from')?.addEventListener('change', rebind);
        document.getElementById('flt-ss-to')?.addEventListener('change', rebind);
        document.getElementById('flt-ss-plan')?.addEventListener('input', rebind);
        document.getElementById('flt-ss-ex')?.addEventListener('change', rebind);
        document.getElementById('btn-ss-clear')?.addEventListener('click', () => {
          ['flt-ss-from','flt-ss-to','flt-ss-plan','flt-ss-ex'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = '';
          });
          loadSessions();
        });
        document.getElementById('btn-ss-new')?.addEventListener('click', openSessionForm);
      }

      // Personal Records
      if (S.page === 'records') {
        document.getElementById('pr-select')?.addEventListener('change', e => {
          if (e.target.value) loadPR(e.target.value);
          else document.getElementById('pr-result').innerHTML = empty('🏆','Selecione um exercício para ver o PR.');
        });
      }

      // Users
      if (S.page === 'users') {
        loadUsers();
        document.getElementById('flt-usr-name')?.addEventListener('input',
          () => loadUsers(currentUserFilters()));
        document.getElementById('flt-usr-email')?.addEventListener('input',
          () => loadUsers(currentUserFilters()));
        document.getElementById('btn-usr-clear')?.addEventListener('click', () => {
          document.getElementById('flt-usr-name').value = '';
          document.getElementById('flt-usr-email').value = '';
          loadUsers();
        });
      }
    }

    // ════════════════════════════════════════════════════════════════════════════
    //  INICIALIZAÇÃO
    // ════════════════════════════════════════════════════════════════════════════
    (async () => {
      if (S.token) {
        const p = decodeJwt(S.token);
        S.user = { email: p.sub, role: p.role || 'USER', name: p.name || p.sub };
        S.page = 'dashboard';
        await boot();
      } else {
        S.page = 'login';
      }
      render();
    })();
</script>
</body>
</html>
